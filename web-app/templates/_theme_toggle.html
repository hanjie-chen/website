{# theme-toggle.js reveals the button and labels it; without scripts the page follows the system theme. #}
<button class="site-theme-toggle" type="button" data-theme-toggle hidden
    data-label-light="{{ t('theme.switch.light') }}" data-label-dark="{{ t('theme.switch.dark') }}">
    <svg class="site-theme-icon site-theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="site-theme-icon site-theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
</button>
