<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's moon: gilded with a halo ring on light browser chrome, glowing on dark. -->
  <style>
    .core { fill: #b8781c; }
    .ring { fill: none; stroke: #b8781c; stroke-opacity: 0.55; stroke-width: 1.6; }
    .glow { display: none; }
    @media (prefers-color-scheme: dark) {
      .core { fill: #e3a548; }
      .ring { display: none; }
      .glow { display: inline; }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0.55" stop-color="#e3a548" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e3a548" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle class="glow" cx="16" cy="16" r="16" fill="url(#glow)"/>
  <circle class="ring" cx="16" cy="16" r="14.2"/>
  <circle class="core" cx="16" cy="16" r="10"/>
</svg>
