name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main # 仅 main 分支 push 触发
  pull_request:
    branches:
      - main # 针对 main 分支的 pull request 触发

# GHCR push 需要 packages: write。
# 说明：这里使用 GitHub 自动注入的 GITHUB_TOKEN，不需要手动创建 token。
permissions:
  contents: read
  packages: write

jobs:
  container-security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history for image comparison
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve changed pinned third-party images
        id: changed_images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha=""
          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            push)
              base_sha="${PUSH_BEFORE_SHA}"
              ;;
            workflow_dispatch)
              git fetch --no-tags origin main
              base_sha="$(git rev-parse origin/main)"
              if [[ "${base_sha}" == "$(git rev-parse HEAD)" ]]; then
                base_sha=""
              fi
              ;;
          esac

          comparison_args=()
          if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^0+$ ]] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_compose="${RUNNER_TEMP}/base-compose.yml"
            base_config="${RUNNER_TEMP}/base-container-images.json"
            git show "${base_sha}:compose.yml" > "${base_compose}"
            git show "${base_sha}:scripts/security/container-images.json" > "${base_config}"
            comparison_args=(
              --base "${base_compose}"
              --base-config "${base_config}"
            )
            if ! git diff --quiet "${base_sha}" HEAD -- scripts/security/trivyignore.yaml; then
              comparison_args+=(--force-all)
              echo "The Trivy exception policy changed; all tracked images will be scanned."
            fi
            echo "Comparing pinned images in ${base_sha} with $(git rev-parse HEAD)."
          else
            echo "::notice title=Full third-party image scan::No usable comparison commit was available, so every tracked image will be scanned."
          fi

          images_file="${RUNNER_TEMP}/changed-third-party-images.txt"
          python3 scripts/security/container_ci_gate.py changed \
            --config scripts/security/container-images.json \
            "${comparison_args[@]}" \
            --head compose.yml > "${images_file}"
          mapfile -t images < "${images_file}"
          echo "count=${#images[@]}" >> "${GITHUB_OUTPUT}"
          {
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if (( ${#images[@]} == 0 )); then
            {
              echo "No pinned third-party image reference changed in this revision."
              echo "Existing findings remain tracked by the scheduled Container Security workflow."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "The required security gate will scan these changed image references:"
              printf -- '- \x60%s\x60\n' "${images[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Pin the setup action to the verified immutable v0.3.1 release commit.
      - name: Set up Trivy
        if: steps.changed_images.outputs.count != '0'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: v0.72.0

      - name: Scan changed pinned third-party images
        if: steps.changed_images.outputs.count != '0'
        env:
          CHANGED_IMAGES: ${{ steps.changed_images.outputs.images }}
          TRIVY_NO_PROGRESS: "true"
        run: |
          set -euo pipefail
          scan_status=0
          while IFS= read -r image; do
            [[ -n "${image}" ]] || continue
            if ! trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile scripts/security/trivyignore.yaml \
              --skip-version-check \
              --exit-code 1 \
              "${image}"; then
              scan_status=1
            fi
          done <<< "${CHANGED_IMAGES}"
          exit "${scan_status}"

  application-and-runtime-checks:
    runs-on: ubuntu-latest # 使用最近的 ubuntu image
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v7
      # 检查 compose.yml 语法
      - name: Validate compose (prod)
        run: docker compose -f compose.yml config

      - name: Validate compose (dev overlay)
        run: docker compose -f compose.yml -f compose.dev.yml config

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck -x scripts/deploy/*.sh articles-sync/*.sh

      # 跑 web-app tests.
      - name: Build web-app (test)
        run: docker compose -f compose.yml -f compose.dev.yml build web-app

      - name: Run ruff
        run: docker compose -f compose.yml -f compose.dev.yml run --rm --no-deps -T web-app ruff check .

      - name: Run format check
        run: docker compose -f compose.yml -f compose.dev.yml run --rm --no-deps -T web-app ruff format --check .

      # Security advisory step (non-blocking for now):
      # - scan locked Python dependencies from requirements.txt
      # - use official PyPA action
      - name: Set up Python for pip-audit
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pip-audit (advisory, official action)
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: web-app/requirements.txt
          no-deps: true

      - name: Test container security remediation helper
        run: python3 -m unittest discover -s scripts/security/tests -p 'test_*.py' -v

      - name: Run pytest with coverage gate
        run: >
          docker compose -f compose.yml -f compose.dev.yml run --rm --no-deps -T web-app
          pytest -q
          --cov=app
          --cov=import_articles_scripts
          --cov=markdown_render_scripts
          --cov=models
          --cov-report=term-missing
          --cov-fail-under=30

      - name: Generate temporary TLS fixture
        run: |
          mkdir -p nginx-modsecurity/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout nginx-modsecurity/ssl/hanjie-chen.com.key \
            -out nginx-modsecurity/ssl/hanjie-chen.com.crt \
            -subj "/CN=hanjie-chen.com"
          # The candidate image runs Nginx as a non-root user. This key is an
          # ephemeral self-signed CI fixture, so it must be readable in the
          # bind-mounted container regardless of the runner's UID.
          chmod 0644 nginx-modsecurity/ssl/hanjie-chen.com.key

      - name: Validate candidate nginx configuration
        run: >
          docker compose -f compose.yml -f compose.dev.yml
          run --rm --no-deps -T nginx-modsecurity nginx -t

      - name: Validate candidate runtime and smoke checks
        env:
          DAILY_BRIEF_PUBLISH_TOKEN: ci-daily-brief-token
          BRIEF_INGEST_TEST_TOKEN: ci-daily-brief-token
        run: |
          set -euo pipefail
          docker compose -f compose.yml -f compose.dev.yml \
            run --rm --no-deps -T web-app python scripts/init_db.py
          docker compose -f compose.yml -f compose.dev.yml \
            up -d --no-deps web-app dozzle nginx-modsecurity
          COMPOSE_FILE=compose.yml:compose.dev.yml \
            ./scripts/deploy/wait_services_healthy.sh web-app nginx-modsecurity dozzle
          BASE_URL=https://127.0.0.1:8444 ./scripts/deploy/smoke_check.sh

      - name: Stop candidate runtime
        if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down --remove-orphans

  publish-first-party-images:
    if: github.event_name == 'push'
    needs:
      - container-security-gate
      - application-and-runtime-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR（ghcr.io）集成：仅在 main push 的 required checks 全部通过后执行。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web-app image
        uses: docker/build-push-action@v7
        with:
          context: ./web-app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/website-web-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/website-web-app:latest

      - name: Build and push articles-sync image
        uses: docker/build-push-action@v7
        with:
          context: ./articles-sync
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/website-articles-sync:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/website-articles-sync:latest

  # Preserve the existing required-check name while allowing the security and
  # runtime jobs to finish independently and report all relevant failures.
  compose-check-and-build:
    if: always()
    needs:
      - container-security-gate
      - application-and-runtime-checks
      - publish-first-party-images
    runs-on: ubuntu-latest
    steps:
      - name: Require successful security and runtime checks
        env:
          SECURITY_RESULT: ${{ needs.container-security-gate.result }}
          APPLICATION_RESULT: ${{ needs.application-and-runtime-checks.result }}
          PUBLISH_RESULT: ${{ needs.publish-first-party-images.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${SECURITY_RESULT}" != "success" \
            || "${APPLICATION_RESULT}" != "success" \
            || ( "${EVENT_NAME}" == "push" && "${PUBLISH_RESULT}" != "success" ) \
            || ( "${EVENT_NAME}" != "push" && "${PUBLISH_RESULT}" != "skipped" ) ]]; then
            echo "Container security gate: ${SECURITY_RESULT}"
            echo "Application and runtime checks: ${APPLICATION_RESULT}"
            echo "First-party image publication: ${PUBLISH_RESULT}"
            exit 1
          fi
