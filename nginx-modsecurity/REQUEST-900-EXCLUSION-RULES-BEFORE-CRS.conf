# Site-specific CRS exclusions, loaded before the CRS rules.
#
# Note category pages and rendered note assets take their URL paths from
# knowledge base folder and file names (docker-learn, ansible, Dockerfile...),
# which CRS path rules read as Unix commands or restricted files. Flask only
# looks a category up among imported notes, and Nginx serves assets from a
# read-only folder, so only the path checks are skipped there; arguments,
# headers and bodies are still inspected, and so are path traversal checks on
# the raw URI.
SecRule REQUEST_FILENAME "@rx ^/(?:zh|en)/notes/category/|^/rendered-articles/" \
    "id:1000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetByTag=attack-lfi;REQUEST_FILENAME"
