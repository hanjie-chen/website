# Daily Brief fields are stored as plain text and escaped by Jinja before they
# reach HTML. Legitimate summaries can discuss literal <script> examples, which
# otherwise trigger three generic XSS detectors before the application can
# authenticate and strictly validate the JSON payload. Keep every other CRS
# rule active for this endpoint and remove only the confirmed false positives.
SecRule REQUEST_URI "@streq /internal/briefs" \
    "id:1000001,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=941100,ctl:ruleRemoveById=941110,ctl:ruleRemoveById=941160"

# CRS 942100/libinjection can misclassify UTF-8 Chinese prose as SQLi. Runtime
# target exclusions do not support regexes, so enumerate only the seven summary
# targets allowed by schema v1 (five AI items and two non-AI hot items). The
# rule remains active for every other JSON field and every other endpoint.
SecRule REQUEST_URI "@streq /internal/briefs" \
    "id:1000002,phase:1,pass,t:none,nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.ai.items.array_0.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.ai.items.array_1.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.ai.items.array_2.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.ai.items.array_3.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.ai.items.array_4.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.non_ai_hot.items.array_0.summary,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.sections.non_ai_hot.items.array_1.summary"
