# Daily Brief fields are stored as plain text and escaped by Jinja before they
# reach HTML. Legitimate summaries can discuss literal <script> examples, which
# otherwise trigger three generic XSS detectors before the application can
# authenticate and strictly validate the JSON payload. Keep every other CRS
# rule active for this endpoint and remove only the confirmed false positives.
SecRule REQUEST_URI "@streq /internal/briefs" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=941100,ctl:ruleRemoveById=941110,ctl:ruleRemoveById=941160"
